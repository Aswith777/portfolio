server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aswith-portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Default Dev Configuration with H2 in-memory database
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:aswithdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Optional MongoDB configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aswith_portfolio}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500}
